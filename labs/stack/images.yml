# Every image the stack pulls, with the date it was checked and the platforms it publishes.
#
# The rule labs/README.md states: an image must publish linux/amd64 and linux/arm64. An amd64-only
# image runs under emulation on an M-series Mac, which is slow enough to ruin a session, or does
# not run at all. Check before pinning a tag, and record the digest so a delivery can prove it is
# running what was tested.
#
# This file is data for a human and for a future check in scripts/validate.mjs. Nothing reads it
# yet; docker-compose.yml carries the tags.
#
# Re-verify before every delivery (HANDOFF-LAB.md, "Verify before each delivery").

checked: 2026-09-22

images:

  - role: base image for the Aquaflux APIs, the seeding proxy and the workspace
    image: python:3.12-slim
    digest: sha256:2f17fc044b579bab302c2e8054d3a686e2cb9a83de48e70534b94cd8ebbe06a9
    platforms: [linux/amd64, linux/arm64, linux/386, linux/arm, linux/ppc64le, linux/riscv64, linux/s390x]
    used_by: [mdm, cis, wom, seed, tools, workspace]

  - role: model runtime
    image: ollama/ollama:0.12.3
    digest: sha256:c622a7adec67cf5bd7fe1802b7e26aa583a955a54e91d132889301f50c3e0bd0
    platforms: [linux/amd64, linux/arm64]
    used_by: [ollama]

  - role: model gateway
    image: ghcr.io/berriai/litellm:v1.83.14-stable
    digest: sha256:c81eb79cd4333c6cfe374c0ec929110fd23f0ee5f7fd198855a6fbddc77b83ba
    platforms: [linux/amd64, linux/arm64]
    used_by: [models]
    note: >
      This image has no curl. model-gateway/entrypoint.sh probes the model runtimes with Python
      for that reason, and the Compose health check does too. A probe written with curl ran, found
      nothing, and silently chose the container runtime every time, which looked exactly like
      working.

  - role: identity provider
    image: quay.io/keycloak/keycloak:26.7.4
    digest: sha256:82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c
    platforms: [linux/amd64, linux/arm64, linux/ppc64le]
    used_by: [identity]
    note: >
      Ships no openssl and no curl, which is why the certificate is generated by the `tls`
      service and the health check goes through bash's /dev/tcp against the management port.
      Standard RFC 8693 token exchange works with no feature flag and no per-client switch on
      this version, which was measured, not assumed. It issues no `act` claim: see OD-024.

  - role: certificate generation, runs once
    image: alpine:3.22
    digest: sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
    platforms: [linux/amd64, linux/arm64, linux/386, linux/arm, linux/ppc64le, linux/riscv64, linux/s390x]
    used_by: [tls]

  - role: TLS ingress for every public name
    image: caddy:2.10-alpine
    digest: sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    platforms: [linux/amd64, linux/arm64, linux/arm, linux/ppc64le, linux/riscv64, linux/s390x]
    used_by: [ingress]

  - role: the lab browser
    image: jlesage/firefox:v26.08.3
    digest: sha256:193ef860a97b161f5f92dde0476550673e9905a6eaf12f376fd1f059068ab45b
    platforms: [linux/amd64, linux/arm64, linux/386, linux/arm]
    used_by: [browser]
    note: >
      Pinned to v26.08.3 and its digest on 2026-09-24; it was on latest until then, the same
      digest, so nothing that runs changed. Firefox keeps its own
      certificate store, so the lab certificate is installed through an enterprise policy in
      browser/policies.json and not through the system trust store. kasmweb/chrome was rejected:
      amd64 only, which breaks the Apple Silicon rule.

  - role: policy engine
    image: openpolicyagent/opa:1.20.2
    digest: sha256:7b15f9d96345dfa639322ad97f65a0b38260f95efcdd7f5c24e284228708f06c
    platforms: [linux/amd64, linux/arm64]
    used_by: [policy]
    note: >
      Distroless: no shell, no curl, no wget, so the Compose health check is the engine probing
      itself with `opa eval` and `http.send`. The -debug variant was tried first; its busybox has
      no wget applet either. Starts with no policy loaded, by design: the learner's policy/
      directory is loaded by `aqx policy apply`, which smoke.sh runs with the module's starting
      policy. Decision logs go to the console, so `docker compose logs policy` shows every query.

  - role: the showcase gateway, opt in, beside the stack
    image: ghcr.io/ibm/mcp-context-forge:v1.0.0-RC-3
    digest: sha256:0a4feab65ae1619f98b6fbea65e51cf1a74069dc66ee9ed23974fa9eb181d142
    platforms: [linux/amd64, linux/arm64, linux/s390x, linux/ppc64le]
    used_by: [showcase]
    note: >
      A release candidate, and named as one in c-02's handout. Evaluated as the tool gateway
      for the labs and not chosen, for measured reasons in ADR-021; kept as a showcase so the
      room meets a real product's console and its tool renaming. Forces a password change on
      first login unless ADMIN_REQUIRE_PASSWORD_CHANGE_ON_BOOTSTRAP is false, and refuses to
      register a server on a private address unless SSRF protection is off.

  - role: relational store and vectors
    image: pgvector/pgvector:pg17
    digest: sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    platforms: [linux/amd64, linux/arm64]
    used_by: [db]
    note: >
      PostgreSQL 17 with the pgvector extension available, version 0.8.6 at the time of checking,
      which is the version b-01's handout names. The extension is installed by `create extension`
      in the learner's schema, not by the image.

  - role: vector engine
    image: qdrant/qdrant:v1.19.1
    digest: sha256:12364fe851b9f17356fc88189fc06d1b521262e04659ec7345975b00c9246a10
    platforms: [linux/amd64, linux/arm64]
    used_by: [vectors]
    note: >
      For b-01's open tier comparison only; it starts empty and no handout command loads it. The
      image has bash and no curl, so the Compose health check speaks HTTP through /dev/tcp and
      must be run by bash by name: CMD-SHELL uses /bin/sh, which is dash here and has no /dev/tcp.

  - role: telemetry collector
    image: otel/opentelemetry-collector-contrib:0.161.0
    digest: sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    platforms: [linux/386, linux/amd64, linux/arm, linux/arm64, linux/ppc64le, linux/riscv64, linux/s390x]
    used_by: [collector]
    note: >
      The contrib distribution, for the file_log receiver and the file exporter d-04 turns on.
      No shell, so no Compose health check; the health_check extension answers on 13133 and
      smoke.sh curls it through the ingress. Runs as uid 10001, and a fresh named volume is
      root-owned, so the service runs as root in its container or the file exporter cannot
      create its directory (the showcase had the same problem). The `otlp` exporter alias is
      deprecated in this version; the configuration says `otlp_grpc`.

  - role: trace store and viewer
    image: jaegertracing/jaeger:2.21.0
    digest: sha256:3d0ac795ff98aa04d1be04311d2dac6c25b4bfc8322dc02e53bc5b170c5018c3
    platforms: [linux/amd64, linux/arm64, linux/ppc64le, linux/s390x]
    used_by: [traces]
    note: >
      Version 2, built on the collector. Memory storage by default, which is the point d-04 makes
      about retention: it restarts empty and telemetry-seed refills it. OTLP in on 4317 and 4318,
      the viewer and the query API on 16686. The query API is /api/v3 only on this version:
      /api/v3/services, /api/v3/traces/<id>, and /api/v3/traces with query.service_name, a
      required time window and query.attributes as a URL-encoded JSON map. The older
      /api/traces?service=...&tags=... search answers 404, which d-04's first draft assumed and
      `aqx trace` now wraps.

  - role: workflow engine, development mode
    image: temporalio/temporal:1.5.1
    digest: sha256:597a5dbbcc6e7716b326dde4a51622d5ea0879eb0cf06ff8a94381361d0a987d
    platforms: [linux/amd64, linux/arm64]
    used_by: [workflow]
    note: >
      The CLI image: `temporal server start-dev` is the one process, server and web interface
      together, state in memory (Server 1.29.1, UI 2.42.1 inside CLI 1.5.1). Distroless, runs as
      its own user, no shell, so the Compose health check is the CLI asking its own server. The
      web interface is proxied by the ingress on 8233; the gRPC front end on 7233 is reached by
      service name only, by the worker and the run script in the dev container. Memory rather
      than a database file on purpose: the engine is never restarted during e-03, only the
      worker is, and a fresh named volume would be root-owned for a non-root image (the
      collector and the showcase both met that).

packages:

  # Not images, but the same problem: they are pinned, they move, and a lab breaks silently when
  # they do. The MCP SDK is the one a learner writes against in c-02.

  - name: opa (command line, in the dev container)
    version: "1.20.2"
    checked: 2026-09-21
    used_by: [workspace, the learner's `opa test policy/` in d-03 and f-01]
    note: >
      The static binary from openpolicyagent.org/downloads, verified against its published
      sha256 at build time in .devcontainer/Dockerfile. Same version as the `policy` service, so
      a test that passes in the terminal decides the same way in the engine. Rego v1 syntax:
      `if` on every rule body, `in` and `some ... in` without an import.

  - name: opentelemetry-sdk, opentelemetry-exporter-otlp-proto-http
    version: "1.44.0"
    checked: 2026-09-22
    used_by: [workspace, tools, the agents in labs/stack/agent/]
    note: >
      What the agents and the gateway write their spans with, over OTLP/HTTP. The exporter is
      installed only when a collector answers a probe, so the other labs run with the telemetry
      profile down and nothing slows or logs. d-04's second fix is two `set_attribute` lines in
      this API, in labs/stack/agent/ask.py.

  - name: temporalio
    version: "1.33.0"
    checked: 2026-09-22
    used_by: [workspace, the worker and the run script in labs/e-03 and labs/stack/workflow]
    note: >
      The engine's Python SDK, with a Rust core: it publishes abi3 wheels for manylinux x86_64
      and aarch64, checked with `pip download --platform`, so the dev container builds on both
      architectures without a compiler. Its OpenTelemetry interceptor
      (temporalio.contrib.opentelemetry) carries the trace context in the workflow's headers,
      which is how e-03's resumed activity joins the trace the request opened. Heartbeats are
      throttled by the SDK to most of the heartbeat timeout by default; the worker sets the
      throttle to two seconds (labs/e-03/*/worker.py says why).

  - name: mcp
    version: "2.2.0"
    checked: 2026-09-21
    used_by: [workspace, tools, the learner's own server in c-02]
    note: >
      Version 2 renamed `FastMCP` to `MCPServer` and the model fields to snake_case
      (`input_schema`, `output_schema`, `is_error`). c-02's handout prints `MCPServer`, which is
      correct for 2.x and wrong for 1.x, and version 1 code raises an import error saying so.
      The gateway reads both spellings where the wire and the model disagree.

models:

  - name: qwen2.5:3b-instruct
    role: the model behind aquaflux-default and aquaflux-alt
    size_on_disk: 1.9 GB
    measured: 2026-09-20
    note: >
      Measured against a-02's two requirements on this stack. Tool calling five runs out of five,
      strict JSON output through the gateway, about seven to fifteen seconds per call on a
      laptop CPU with no GPU passed through. qwen2.5:7b-instruct was measured beside it and
      behaved identically on every check, including reproducing the same malformed date arguments,
      so the larger download and the larger memory floor buy nothing here. Re-measure with
      labs/stack/check_model.py before every delivery.

  - name: nomic-embed-text
    role: the embedding model behind aquaflux-embed, on the local runtime
    size_on_disk: 274 MB
    measured: 2026-09-22
    note: >
      768 dimensions. The hosted endpoint of dec:OD-025 has a chat deployment and no embedding
      one (the configured embedding deployment answers DeploymentNotFound), so the gateway probes
      the hosted embedding at startup and falls back to this model on the local runtime when it
      does not answer, whatever the chat model does. Pulled by `smoke.sh b-01` when missing.
      Measured over the twenty documents: every answerable question's best similarity between
      0.81 and 0.91, the identifier question 0.62 with the asset sheet ninth, the out-of-corpus
      question 0.68. 104 chunks embed in about eight seconds on a laptop CPU.
