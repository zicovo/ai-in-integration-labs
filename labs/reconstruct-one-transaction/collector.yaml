# The collector, as it was deployed. This is the configuration reconstruct-one-transaction has you read and change.
#
# `aqx collector apply collector.yaml` bakes this file into the collector's image and restarts it,
# which takes a few seconds; there is no bind mount and no live reload, on purpose (ADR-019).
# Nothing here is wrong, in the sense that nothing fails. Read the pipelines twice.
#
# Two pipelines carry traces: one to the trace viewer for debugging, with the attribute names the
# frameworks emit, and one to the audit store, normalised into the Aquaflux audit schema
# (audit-schema.md). A third pipeline carries logs to the audit store. The tool gateway writes its
# decision records to its own file, /var/log/tool-gateway/decisions.jsonl, and the receiver that
# reads that file is defined below.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # The tool gateway's decision records, one JSON object per line. Each line carries the trace id
  # of the call it decided, so a record read here lands on the same trace as the call.
  file_log/gateway-decisions:
    include: [ /var/log/tool-gateway/decisions.jsonl ]
    start_at: beginning
    storage: file_storage/checkpoints
    operators:
      - type: json_parser
        timestamp:
          parse_from: attributes.at
          layout: '%Y-%m-%dT%H:%M:%SZ'
      - type: trace_parser
        trace_id:
          parse_from: attributes.trace_id
        span_id:
          parse_from: attributes.span_id
      - type: add
        field: attributes.aquaflux.record
        value: policy_decision

processors:
  batch: {}

  # The normalisation reconstruct-one-transaction's study text argues for: whatever the framework called it, the audit
  # store reads the Aquaflux name. The `gen_ai.*` names are at Development status and move; the
  # `aquaflux.*` names are ours and do not. Add a row here when a framework upgrade renames one.
  attributes/audit-schema:
    actions:
      - key: aquaflux.model.requested
        from_attribute: gen_ai.request.model
        action: insert
      - key: aquaflux.model.answered
        from_attribute: gen_ai.response.model
        action: insert
      - key: aquaflux.tool
        from_attribute: gen_ai.tool.name
        action: insert
      - key: aquaflux.agent
        from_attribute: gen_ai.agent.name
        action: insert
      - key: aquaflux.operation
        from_attribute: gen_ai.operation.name
        action: insert

exporters:
  # The debugging view. Retention is the viewer's, which is memory here and days in a product.
  otlp_grpc/jaeger:
    endpoint: traces:4317
    tls:
      insecure: true

  # The audit store: storage you control, append only, one JSON object per line. The ingress
  # serves it read-only at https://collector.aquaflux.internal:13133/audit/audit.jsonl and
  # `aqx audit` reads it for you.
  file/audit-store:
    path: /var/lib/aquaflux/audit/audit.jsonl
    append: true
    flush_interval: 1s

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
    path: /healthz
  file_storage/checkpoints:
    directory: /var/lib/aquaflux/audit/checkpoints
    create_directory: true

service:
  extensions: [ health_check, file_storage/checkpoints ]
  telemetry:
    logs:
      level: warn
  pipelines:
    traces/debug:
      receivers: [ otlp ]
      processors: [ batch ]
      exporters: [ otlp_grpc/jaeger ]
    traces/audit:
      receivers: [ otlp ]
      processors: [ attributes/audit-schema, batch ]
      exporters: [ file/audit-store ]
    logs/audit:
      receivers: [ otlp ]            # the decision receiver belongs here
      processors: [ batch ]
      exporters: [ file/audit-store ]
