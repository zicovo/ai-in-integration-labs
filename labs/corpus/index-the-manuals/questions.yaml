# yaml-language-server: $schema=../../../schemas/corpus-questions.schema.json
# The ten test questions for index-the-manuals. Programme content, approved: false, reviewed like a module.
# `relevance.yaml` names the documents that answer each. Question nine is the identifier
# question the handout's deliberate failure turns on; seven is the other identifier question and
# ten is the negation, which the open tier's constraints ask for.
module: b-01-embeddings-and-vector-search
approved: false
questions:
  - id: 1
    text: How often do we grease the spindle of a gate valve?
    kind: paraphrase
  - id: 2
    text: A booster pump trips on high motor temperature. What do we check first?
    kind: paraphrase
  - id: 3
    text: What pressure test is required after replacing a booster pump seal?
    kind: paraphrase
  - id: 4
    text: How do we adjust the outlet pressure of a pressure reducing valve?
    kind: paraphrase
  - id: 5
    text: How much notice does a customer get before a disconnection for non-payment?
    kind: paraphrase
  - id: 6
    text: What is the reconnection fee after a disconnection for arrears?
    kind: fact
  - id: 7
    text: Which consumption band does tariff code T2 cover?
    kind: identifier
  - id: 8
    text: How long do we flush the tap before taking a lead sample?
    kind: freshness
  - id: 9
    text: What does valve V-2231 need at its next service?
    kind: identifier
  - id: 10
    text: Which chlorination unit tasks may a field technician not carry out alone?
    kind: negation
